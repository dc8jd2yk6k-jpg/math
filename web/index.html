<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Δt → 0</title>
<style>
  :root { --fg: #e9eefb; --dim: #8291ad; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fg); font: 13px/1.4 "JetBrains Mono", ui-monospace, monospace; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; background: #000; cursor: pointer; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px; display: flex; gap: 12px; align-items: center; background: linear-gradient(transparent, rgba(0,0,0,.7)); transition: opacity .3s; }
  #ui.hidden { opacity: 0; }
  #ui button { background: none; border: 1px solid #fff4; color: var(--fg); width: 34px; height: 28px; border-radius: 4px; cursor: pointer; }
  #scrub { flex: 1; accent-color: #b56cff; }
  #time, #fps { color: var(--dim); white-space: nowrap; }
</style>
<script type="importmap">{ "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }</script>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="ui">
  <button id="play" title="Play / pause (space)">▶</button>
  <input id="scrub" type="range" min="0" max="1000" value="0">
  <span id="time"></span><span id="fps"></span>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
